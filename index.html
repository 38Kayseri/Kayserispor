<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayserispor Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1712] text-white pb-20">

    <!-- Üst Canlı Skor Bandı -->
    <div class="bg-[#15231b] p-3 text-center text-xs font-bold border-b border-gray-800 flex justify-between items-center px-4">
        <span class="text-red-500 font-bold">● CANLI</span>
        <span>Kayserispor 0 - 0 Rakip</span>
        <span class="text-gray-400">75'</span>
    </div>

    <!-- Haber Kartı -->
    <main class="p-4 max-w-md mx-auto">
        <span class="text-xs text-yellow-500 font-semibold">Haberler / A Takım</span>
        <h1 class="text-xl font-bold mt-1 mb-3">Kayserispor Hazırlık Maçında Sahada!</h1>
        <img src="https://via.placeholder.com/400x220" class="rounded-lg w-full object-cover mb-4" alt="Haber">
        <p class="text-gray-300 text-sm leading-relaxed">
            Kayserispor, yeni sezon hazırlıklarını tüm hızıyla sürdürüyor...
        </p>
    </main>

    <!-- Mobil Alt Menü (Bottom Navigation) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#15231b] border-t border-gray-800 flex justify-around py-2 text-center text-xs text-gray-400">
        <button class="flex flex-col items-center text-yellow-500">
            <span>⚽</span><span>Skorlar</span>
        </button>
        <button class="flex flex-col items-center">
            <span>🏆</span><span>Ligler</span>
        </button>
        <button class="flex flex-col items-center">
            <span>📰</span><span>Haberler</span>
        </button>
        <button class="flex flex-col items-center">
            <span>📊</span><span>Puan Durumu</span>
        </button>
    </nav>

</body>
</html>
